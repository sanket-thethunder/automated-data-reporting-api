version: "3.9"

services:
  api:
    build: .
    container_name: report_generator_api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - report_outputs:/tmp/report_gen/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  report_outputs:
